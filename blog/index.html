---
layout: default
title: Blog
---
<h1>Blog</h1>
{% if site.posts.size == 0 %}<p>No posts yet.</p>{% endif %}
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="meta">{{ post.date | date: "%B %-d, %Y" }}</span>
    {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
