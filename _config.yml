title: Kody Almizyed
description: Mechanical engineering portfolio and blog.
markdown: kramdown
exclude:
  - README.md
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
